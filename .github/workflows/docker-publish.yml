name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional, e.g. custom-build-1; defaults to crate version, short git sha, and latest on master)'
        required: false
        type: string
        default: ''
      push:
        description: 'Push images to GHCR'
        required: true
        type: boolean
        default: true
      create_manifest:
        description: 'Create unified multi-arch manifest list for the base image (without arch suffix in image name)'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-arch:
    name: Build & Push (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: arm32

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Custom Tag
        id: validate_tag
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$CUSTOM_TAG" ]]; then
            if [[ ! "$CUSTOM_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid Docker tag '$CUSTOM_TAG'. Must match ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$"
              exit 1
            fi
            echo "custom_tag=$CUSTOM_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Crate Version
        id: crate_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rsqlite-rsync") | .version')
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            VERSION=$(grep -m1 '^version' Cargo.toml | awk -F '"' '{print $2}')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted crate version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.crate_version.outputs.version }},enable=${{ steps.crate_version.outputs.version != '' }}
            type=raw,value=v${{ steps.crate_version.outputs.version }},enable=${{ steps.crate_version.outputs.version != '' }}
            type=sha,format=short,prefix=
            type=raw,value=${{ steps.validate_tag.outputs.custom_tag }},enable=${{ steps.validate_tag.outputs.custom_tag != '' }}
            type=ref,event=branch

      - name: Build and push arch-specific Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

  create-multiarch-manifest:
    name: Create & Push Multi-Arch Manifest
    needs: build-and-push-arch
    if: ${{ inputs.push && inputs.create_manifest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Custom Tag
        id: validate_tag
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$CUSTOM_TAG" ]]; then
            if [[ ! "$CUSTOM_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid Docker tag '$CUSTOM_TAG'. Must match ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$"
              exit 1
            fi
            echo "custom_tag=$CUSTOM_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Crate Version
        id: crate_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rsqlite-rsync") | .version')
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            VERSION=$(grep -m1 '^version' Cargo.toml | awk -F '"' '{print $2}')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          CUSTOM_TAG: ${{ steps.validate_tag.outputs.custom_tag }}
          FULL_SHA: ${{ github.sha }}
          IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
          CRATE_VER: ${{ steps.crate_version.outputs.version }}
        run: |
          BASE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ARCHS=("amd64" "arm64" "arm32")

          # Sources are always the immutable full commit-SHA tagged arch images
          sources=()
          for arch in "${ARCHS[@]}"; do
            sources+=("${BASE_IMAGE}-${arch}:${FULL_SHA}")
          done

          create_manifest() {
            local dest_tag="$1"
            echo "Creating multi-arch manifest for ${BASE_IMAGE}:${dest_tag} from immutable sources:"
            printf ' - %s\n' "${sources[@]}"
            docker buildx imagetools create -t "${BASE_IMAGE}:${dest_tag}" "${sources[@]}"
          }

          # Immutable commit SHA manifest
          create_manifest "$FULL_SHA"

          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          create_manifest "$SHORT_SHA"

          if [[ "$IS_MASTER" == "true" ]]; then
            create_manifest "latest"
          fi

          if [[ -n "$CRATE_VER" ]]; then
            create_manifest "$CRATE_VER"
            create_manifest "v${CRATE_VER}"
          fi

          if [[ -n "$CUSTOM_TAG" ]]; then
            create_manifest "$CUSTOM_TAG"
          fi
