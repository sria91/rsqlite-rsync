# Local dev/test variant for exercising the gRPC SQL Gateway + client against
# a real k3d/k3s cluster WITHOUT relying on Kubernetes Lease-based election.
#
# The kubernetes-lease-source manifests (ha-deployment.yaml, etc.) assume
# something continuously claims/renews the coordination.k8s.io Lease and
# refreshes each replica's freshness ledger; today nothing in this repo does
# that (it was previously handled by sidecars that no longer exist), so a
# fresh cluster using --ha-lease-source=kubernetes can never produce a writer.
#
# This manifest sidesteps that gap for local testing by using
# --ha-lease-source=file with a static lease/freshness ConfigMap that
# permanently names sqlite-ha-0 as the writer. To simulate failover, patch
# the sqlite-ha-demo-lease ConfigMap's lease.txt to a different holder_node_id
# (bump generation, refresh renewed_at_secs) and re-apply; the mounted file
# updates in each pod within roughly a kubelet sync interval.
#
# Usage:
#   docker build -t rsqlite-rsync:dev .
#   k3d image import rsqlite-rsync:dev -c <cluster-name>
#   kubectl create namespace sqlite-ha
#   kubectl -n sqlite-ha create configmap sqlite-ha-demo-lease \
#     --from-literal=lease.txt="holder_node_id=sqlite-ha-0
#   generation=1
#   renewed_at_secs=$(date +%s)
#   ttl_secs=86400" \
#     --from-literal=freshness.txt="source_node_id=sqlite-ha-0
#   source_generation=1
#   synced_at_secs=$(date +%s)"
#   kubectl apply -n sqlite-ha -f examples/k8s/local-dev-file-lease.yaml
apiVersion: v1
kind: Service
metadata:
  name: sqlite-ha
  labels:
    app: sqlite-ha
spec:
  clusterIP: None
  ports:
    - port: 8088
      targetPort: probe-http
      name: probe-http
    - port: 50051
      targetPort: grpc
      name: grpc
  selector:
    app: sqlite-ha
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlite-ha
  labels:
    app: sqlite-ha
spec:
  serviceName: sqlite-ha
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: sqlite-ha
  template:
    metadata:
      labels:
        app: sqlite-ha
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: rsqlite-rsync
          image: rsqlite-rsync:dev
          imagePullPolicy: IfNotPresent
          args:
            - --ha
            - --ha-node-id=$(POD_NAME)
            - --ha-lease-source=file
            - --ha-lease-file=/etc/rsqlite-ha/lease.txt
            - --ha-freshness-file=/etc/rsqlite-ha/freshness.txt
            - --ha-role-state-file=/var/run/rsqlite-rsync/role_state.txt
            - --ha-audit-log-file=/var/log/rsqlite-rsync/ha_audit.log
            - --ha-readiness-file=/var/run/rsqlite-rsync/readiness.txt
            - --ha-readiness-http-bind=0.0.0.0:8088
            - --ha-grpc-bind=0.0.0.0:50051
            - --ha-data-dir=/var/lib/sqlite
            - --ha-startup-fence-mode=permissive
            - --ha-tick-interval-ms=250
            - --ha-max-freshness-age-secs=999999999
            - --ha-max-future-skew-secs=999999999
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: probe-http
              containerPort: 8088
            - name: grpc
              containerPort: 50051
          startupProbe:
            httpGet:
              path: /live
              port: probe-http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              # /healthz ("has the reconcile loop ticked"), not /ready
              # ("is this node currently the writer") — every replica pod
              # is permanently /ready==503 by design, and gating Pod
              # readiness (and therefore StatefulSet rollout progression)
              # on that would stall the rollout after one pod. See README
              # "Behavior notes".
              path: /healthz
              port: probe-http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /live
              port: probe-http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: run
              mountPath: /var/run/rsqlite-rsync
            - name: log
              mountPath: /var/log/rsqlite-rsync
            - name: ha-lease
              mountPath: /etc/rsqlite-ha
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: log
          emptyDir: {}
        - name: ha-lease
          configMap:
            name: sqlite-ha-demo-lease
