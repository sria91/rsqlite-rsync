apiVersion: v1
kind: ServiceAccount
metadata:
  name: sqlite-ha
  labels:
    app: sqlite-ha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sqlite-ha-lease-manager
  labels:
    app: sqlite-ha
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["sqlite-writer-lease"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sqlite-ha-lease-manager
  labels:
    app: sqlite-ha
subjects:
  - kind: ServiceAccount
    name: sqlite-ha
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sqlite-ha-lease-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqlite-ha-scripts
  labels:
    app: sqlite-ha
data:
  lease-updater.sh: |
    #!/usr/bin/env sh
    set -eu

    lease_name="${LEASE_NAME:-sqlite-writer-lease}"
    lease_duration="${LEASE_DURATION_SECONDS:-15}"
    renew_sleep="${LEASE_RENEW_SLEEP_SECONDS:-2}"
    role_file="${ROLE_STATE_FILE:-/var/run/rsqlite-rsync/role_state.txt}"

    current_generation() {
      kubectl -n "${POD_NAMESPACE}" get lease "${lease_name}" -o jsonpath='{.metadata.annotations.rsqlite-rsync\.dev/generation}' 2>/dev/null || true
    }

    while true; do
      role_state=""
      if [ -f "$role_file" ]; then
        role_state="$(cat "$role_file" 2>/dev/null || true)"
      fi

      case "$role_state" in
        writer:*)
          local_generation="${role_state#writer:}"
          now_rfc3339="$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)"

          observed_generation="$(current_generation)"
          if [ -n "$observed_generation" ] && [ "$observed_generation" != "$local_generation" ]; then
            if [ "$observed_generation" -gt "$local_generation" ] 2>/dev/null; then
              local_generation="$observed_generation"
            fi
          fi

          if ! kubectl -n "${POD_NAMESPACE}" patch lease "${lease_name}" --type merge -p "{\"metadata\":{\"annotations\":{\"rsqlite-rsync.dev/generation\":\"${local_generation}\"}},\"spec\":{\"holderIdentity\":\"${POD_NAME}\",\"leaseDurationSeconds\":${lease_duration},\"renewTime\":\"${now_rfc3339}\"}}" >/dev/null 2>&1; then
            printf '{"apiVersion":"coordination.k8s.io/v1","kind":"Lease","metadata":{"name":"%s","annotations":{"rsqlite-rsync.dev/generation":"%s"}},"spec":{"holderIdentity":"%s","leaseDurationSeconds":%s,"renewTime":"%s"}}\n' \
              "${lease_name}" "${local_generation}" "${POD_NAME}" "${lease_duration}" "${now_rfc3339}" | kubectl -n "${POD_NAMESPACE}" apply -f - >/dev/null 2>&1 || true
          fi
          ;;
        *)
          ;;
      esac
      sleep "$renew_sleep"
    done

  replica-sync.sh: |
    #!/usr/bin/env sh
    set -eu

    role_file="${ROLE_STATE_FILE:-/var/run/rsqlite-rsync/role_state.txt}"
    freshness_file="${FRESHNESS_FILE:-/var/run/rsqlite-rsync/freshness.txt}"
    sync_sleep="${SYNC_INTERVAL_SECONDS:-5}"
    sync_cmd="${RSQLITE_RSYNC_REPLICA_SYNC_COMMAND:-}"
    lease_name="${LEASE_NAME:-sqlite-writer-lease}"

    while true; do
      role_state=""
      if [ -f "$role_file" ]; then
        role_state="$(cat "$role_file" 2>/dev/null || true)"
      fi

      case "$role_state" in
        writer:*)
          ;;
        *)
          if [ -n "$sync_cmd" ]; then
            if sh -c "$sync_cmd"; then
              holder="$(kubectl -n "${POD_NAMESPACE}" get lease "${lease_name}" -o jsonpath='{.spec.holderIdentity}' 2>/dev/null || true)"
              generation="$(kubectl -n "${POD_NAMESPACE}" get lease "${lease_name}" -o jsonpath='{.metadata.annotations.rsqlite-rsync\.dev/generation}' 2>/dev/null || true)"
              now_secs="$(date +%s)"
              if [ -n "$holder" ] && [ -n "$generation" ]; then
                printf 'source_node_id=%s\nsource_generation=%s\nsynced_at_secs=%s\n' \
                  "${holder}" "${generation}" "${now_secs}" > "$freshness_file"
              fi
            fi
          fi
          ;;
      esac
      sleep "$sync_sleep"
    done

  lease-bootstrap.sh: |
    #!/usr/bin/env sh
    set -eu

    # Only the ordinal-0 pod attempts genesis/recovery bootstrap, and only
    # when the lease is missing or already expired with nobody renewing it.
    # This runs on every restart of pod 0, but is a no-op whenever a live
    # lease is already held, so it never overrides a real election result.
    #
    # The expired case matters because the Lease object is independent of
    # the StatefulSet: it outlives a `kubectl delete statefulset`, so a
    # recreated cluster can inherit a stale lease whose last holder is gone.
    # Nothing else can ever reclaim that lease, since lease-updater.sh only
    # renews it for a node that is already writer, and no node can become
    # writer while the lease it would need to hold is expired.
    case "${POD_NAME}" in
      *-0) ;;
      *) exit 0 ;;
    esac

    lease_name="${LEASE_NAME:-sqlite-writer-lease}"
    lease_duration="${LEASE_DURATION_SECONDS:-15}"
    freshness_file="${FRESHNESS_FILE:-/var/run/rsqlite-rsync/freshness.txt}"

    now_secs="$(date +%s)"
    existing_renew_time="$(kubectl -n "${POD_NAMESPACE}" get lease "${lease_name}" -o jsonpath='{.spec.renewTime}' 2>/dev/null || true)"

    if [ -n "${existing_renew_time}" ]; then
      renewed_at_secs="$(date -u -d "${existing_renew_time}" +%s 2>/dev/null || echo 0)"
      existing_duration="$(kubectl -n "${POD_NAMESPACE}" get lease "${lease_name}" -o jsonpath='{.spec.leaseDurationSeconds}' 2>/dev/null || echo "${lease_duration}")"
      if [ "$((renewed_at_secs + existing_duration))" -ge "${now_secs}" ]; then
        exit 0
      fi
    fi

    prior_generation="$(kubectl -n "${POD_NAMESPACE}" get lease "${lease_name}" -o jsonpath='{.metadata.annotations.rsqlite-rsync\.dev/generation}' 2>/dev/null || true)"
    case "${prior_generation}" in
      ''|*[!0-9]*) next_generation=0 ;;
      *) next_generation=$((prior_generation + 1)) ;;
    esac

    now_rfc3339="$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)"

    printf '{"apiVersion":"coordination.k8s.io/v1","kind":"Lease","metadata":{"name":"%s","annotations":{"rsqlite-rsync.dev/generation":"%s"}},"spec":{"holderIdentity":"%s","leaseDurationSeconds":%s,"renewTime":"%s"}}\n' \
      "${lease_name}" "${next_generation}" "${POD_NAME}" "${lease_duration}" "${now_rfc3339}" \
      | kubectl -n "${POD_NAMESPACE}" apply -f -

    printf 'source_node_id=%s\nsource_generation=%s\nsynced_at_secs=%s\n' \
      "${POD_NAME}" "${next_generation}" "${now_secs}" > "${freshness_file}"
---
apiVersion: v1
kind: Service
metadata:
  name: sqlite-ha
  labels:
    app: sqlite-ha
spec:
  ports:
    - port: 8088
      targetPort: probe-http
      name: probe-http
    - port: 50051
      targetPort: grpc
      name: grpc
  selector:
    app: sqlite-ha
---
apiVersion: v1
kind: Service
metadata:
  name: sqlite-ha-writer
  labels:
    app: sqlite-ha
spec:
  ports:
    - port: 8088
      targetPort: probe-http
      name: probe-http
    - port: 50051
      targetPort: grpc
      name: grpc
  selector:
    app: sqlite-ha
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlite-ha
  labels:
    app: sqlite-ha
spec:
  serviceName: sqlite-ha
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: sqlite-ha
  template:
    metadata:
      labels:
        app: sqlite-ha
    spec:
      serviceAccountName: sqlite-ha
      terminationGracePeriodSeconds: 20
      initContainers:
        - name: data-dir-permissions
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /var/lib/sqlite
              chown 10001:10001 /var/lib/sqlite
              chmod 2775 /var/lib/sqlite
          securityContext:
            runAsUser: 0
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /var/lib/sqlite
              subPathExpr: $(POD_NAME)
        - name: lease-bootstrap
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/lease-bootstrap.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEASE_NAME
              value: sqlite-writer-lease
            - name: LEASE_DURATION_SECONDS
              value: "15"
            - name: FRESHNESS_FILE
              value: /var/run/rsqlite-rsync/freshness.txt
          volumeMounts:
            - name: run
              mountPath: /var/run/rsqlite-rsync
            - name: scripts
              mountPath: /scripts
      containers:
        - name: rsqlite-rsync
          image: __RSQLITE_RSYNC_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --ha
            - --ha-node-id=$(POD_NAME)
            - --ha-lease-source=kubernetes
            - --ha-kube-namespace=$(POD_NAMESPACE)
            - --ha-kube-lease-name=sqlite-writer-lease
            - --ha-role-state-file=/var/run/rsqlite-rsync/role_state.txt
            - --ha-audit-log-file=/var/log/rsqlite-rsync/ha_audit.log
            - --ha-freshness-file=/var/run/rsqlite-rsync/freshness.txt
            - --ha-readiness-file=/var/run/rsqlite-rsync/readiness.txt
            - --ha-readiness-http-bind=0.0.0.0:8088
            - --ha-grpc-bind=0.0.0.0:50051
            - --ha-data-dir=/var/lib/sqlite
            - --ha-startup-fence-mode=permissive
            - --ha-tick-interval-ms=250
            - --ha-max-freshness-age-secs=10
            - --ha-max-future-skew-secs=2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: probe-http
              containerPort: 8088
            - name: grpc
              containerPort: 50051
          startupProbe:
            httpGet:
              path: /live
              port: probe-http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: probe-http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /live
              port: probe-http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: run
              mountPath: /var/run/rsqlite-rsync
            - name: log
              mountPath: /var/log/rsqlite-rsync
            - name: data
              mountPath: /var/lib/sqlite
              subPathExpr: $(POD_NAME)

        - name: lease-updater
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/lease-updater.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ROLE_STATE_FILE
              value: /var/run/rsqlite-rsync/role_state.txt
            - name: LEASE_NAME
              value: sqlite-writer-lease
            - name: LEASE_DURATION_SECONDS
              value: "15"
            - name: LEASE_RENEW_SLEEP_SECONDS
              value: "2"
          volumeMounts:
            - name: run
              mountPath: /var/run/rsqlite-rsync
            - name: scripts
              mountPath: /scripts

        - name: replica-sync
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/replica-sync.sh"]
          securityContext:
            runAsGroup: 10001
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ROLE_STATE_FILE
              value: /var/run/rsqlite-rsync/role_state.txt
            - name: FRESHNESS_FILE
              value: /var/run/rsqlite-rsync/freshness.txt
            - name: LEASE_NAME
              value: sqlite-writer-lease
            - name: SYNC_INTERVAL_SECONDS
              value: "5"
            - name: RSQLITE_RSYNC_REPLICA_SYNC_COMMAND
              value: "__RSQLITE_RSYNC_REPLICA_SYNC_COMMAND__"
          volumeMounts:
            - name: run
              mountPath: /var/run/rsqlite-rsync
            - name: scripts
              mountPath: /scripts
            - name: data
              mountPath: /var/lib/sqlite
              subPathExpr: $(POD_NAME)
      volumes:
        - name: run
          emptyDir: {}
        - name: log
          emptyDir: {}
        - name: scripts
          configMap:
            name: sqlite-ha-scripts
        - name: data
          hostPath:
            path: __RSQLITE_RSYNC_HOST_DATA_DIR__
            type: DirectoryOrCreate
