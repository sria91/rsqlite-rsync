# Lease-manager variant: includes permissions to update/patch/create the Lease.
#
# NOTE: the RBAC here grants update/patch/create so a lease-claiming sidecar
# or controller can be added later, but nothing in this manifest actually
# claims/renews the Lease or writes the freshness ledger yet — the binary
# only reads both. Without one of those in place, every pod stays a
# permanent replica (no crash-loop, but no writer either). For local testing
# without that piece, see local-dev-file-lease.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sqlite-ha
  labels:
    app: sqlite-ha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sqlite-ha-lease-manager
  labels:
    app: sqlite-ha
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["sqlite-writer-lease"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sqlite-ha-lease-manager
  labels:
    app: sqlite-ha
subjects:
  - kind: ServiceAccount
    name: sqlite-ha
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sqlite-ha-lease-manager
---
apiVersion: v1
kind: Service
metadata:
  name: sqlite-ha
  labels:
    app: sqlite-ha
spec:
  # Headless: this is the StatefulSet's governing service (serviceName
  # below), so per-pod DNS records (e.g. sqlite-ha-0.sqlite-ha...) only get
  # created by CoreDNS when this is unset. That per-pod DNS is what the
  # client's --kube-service / Lease-based writer discovery depends on
  # (see rsqlite-rsync-client's KubeLeaseResolver) now that there is no
  # separate writer-routing Service — see README "SQL Gateway and client".
  clusterIP: None
  ports:
    - port: 8088
      targetPort: probe-http
      name: probe-http
    - port: 50051
      targetPort: grpc
      name: grpc
  selector:
    app: sqlite-ha
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlite-ha
  labels:
    app: sqlite-ha
spec:
  serviceName: sqlite-ha
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: sqlite-ha
  template:
    metadata:
      labels:
        app: sqlite-ha
    spec:
      serviceAccountName: sqlite-ha
      terminationGracePeriodSeconds: 20
      containers:
        - name: rsqlite-rsync
          image: ghcr.io/sria91/rsqlite-rsync:latest
          args:
            - --ha
            - --ha-node-id=$(POD_NAME)
            - --ha-lease-source=kubernetes
            - --ha-kube-namespace=$(POD_NAMESPACE)
            - --ha-kube-lease-name=sqlite-writer-lease
            - --ha-freshness-file=/var/run/rsqlite-rsync/freshness.txt
            - --ha-role-state-file=/var/run/rsqlite-rsync/role_state.txt
            - --ha-audit-log-file=/var/log/rsqlite-rsync/ha_audit.log
            - --ha-readiness-file=/var/run/rsqlite-rsync/readiness.txt
            - --ha-readiness-http-bind=0.0.0.0:8088
            - --ha-grpc-bind=0.0.0.0:50051
            - --ha-data-dir=/var/lib/sqlite
            - --ha-startup-fence-mode=permissive
            - --ha-tick-interval-ms=250
            - --ha-max-freshness-age-secs=10
            - --ha-max-future-skew-secs=2
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: probe-http
              containerPort: 8088
            - name: grpc
              containerPort: 50051
          startupProbe:
            httpGet:
              path: /live
              port: probe-http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              # /healthz ("has the reconcile loop ticked"), not /ready
              # ("is this node currently the writer") — every replica pod
              # is permanently /ready==503 by design, and gating Pod
              # readiness (and therefore StatefulSet rollout progression)
              # on that would stall the rollout after one pod. See README
              # "Behavior notes".
              path: /healthz
              port: probe-http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /live
              port: probe-http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 3"
          volumeMounts:
            - name: run
              mountPath: /var/run/rsqlite-rsync
            - name: log
              mountPath: /var/log/rsqlite-rsync
      volumes:
        - name: run
          emptyDir: {}
        - name: log
          emptyDir: {}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: sqlite-writer-lease
  annotations:
    rsqlite-rsync.dev/generation: "1"
spec:
  holderIdentity: ""
  leaseDurationSeconds: 15
