[package]
name = "rsqlite-rsync-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Async gRPC client for the rsqlite-rsync HA SQL Gateway, with leader discovery and automatic failover"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sria91/rsqlite-rsync"
readme = "README.md"

[dependencies]
rsqlite-rsync-proto = { path = "../rsqlite-rsync-proto", version = "0.1.0" }
tonic = "0.14"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
